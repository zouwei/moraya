[package]
name = "moraya"
version = "0.41.8"
description = "A minimal, AI-ready Markdown editor"
authors = ["Moraya Contributors"]
edition = "2021"

[lib]
name = "moraya_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
default = []
diagnostics = []

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = ">=2.11,<2.12", features = ["tray-icon"] }
tauri-plugin-fs = ">=2.5,<2.6"
tauri-plugin-dialog = ">=2.7,<2.8"
tauri-plugin-store = "2"
tauri-plugin-opener = "2"
tauri-plugin-http = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", features = ["stream", "multipart", "json"] }
tokio = { version = "1", features = ["fs", "io-util", "sync", "rt", "time"] }
tokio-tungstenite = { version = "0.24", features = ["native-tls"] }
hmac = "0.12"
sha1 = "0.10"
sha2 = "0.10"
hex = "0.4"
base64 = "0.22"
chrono = "0.4"
futures-util = "0.3"
dirs = "6"
zip = { version = "2", default-features = false, features = ["deflate"] }
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service"] }
hnsw_rs = "0.3"
anndists = "0.1"
# Phase 4: local embedding inference (ort has upstream VitisAI bug — defer to future version)
# ort = { version = "2.0.0-rc.12", default-features = false, features = ["load-dynamic", "ndarray", "std"] }
tokenizers = { version = "0.22", default-features = false, features = ["onig"] }
ndarray = "0.16"
flate2 = "1"
tar = "0.4"
open = "5"
tauri-plugin-global-shortcut = "2"
tauri-plugin-deep-link = "2"
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }
url = "2"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(not(target_os = "ios"))'.dependencies]
fix-path-env = { git = "https://github.com/tauri-apps/fix-path-env-rs" }

[target.'cfg(target_os = "macos")'.dependencies]
objc = "0.2"
objc2 = { version = "0.6.3", features = ["exception"] }
objc2-core-audio = "0.3.2"
objc2-core-audio-types = "0.3.2"
objc2-core-foundation = "0.3.2"
objc2-foundation = "0.3.2"
block = "0.1"

[target.'cfg(target_os = "windows")'.dependencies]
webview2-com = "0.34"
windows = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_System_Com",
  "Win32_System_WinRT",
] }

[target.'cfg(target_os = "linux")'.dependencies]
webkit2gtk = "2.0"

[lints.rust.unexpected_cfgs]
level = "warn"
check-cfg = ['cfg(feature, values("cargo-clippy"))']

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
