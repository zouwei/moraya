name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  create-release:
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    outputs:
      release-id: ${{ steps.create.outputs.id }}
    steps:
      # fetch-depth: 0 so the tag object and its message are available to the
      # release-notes step below (the default shallow fetch has neither).
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      # Release-safety gate (方案 A). Runs ONCE, before the GitHub Release is
      # created and before the 5-way build matrix fans out — so if @moraya/core
      # is still on the vendored-tarball bridge (or points at an unpublished
      # version), the whole release aborts here instead of shipping binaries
      # built against an unpublished core. Shares scripts/check-core-dep.mjs
      # with the pre-push hook (方案 B). ubuntu-24.04 ships Node + npm.
      - name: Guard @moraya/core is published (release mode)
        run: node scripts/check-core-dep.mjs release
      # Build the release body from the actual change log carried by the tag,
      # instead of shipping install instructions with no "what changed" section.
      # Source of truth: the annotated tag message, falling back to the tagged
      # commit message (which `pnpm version:bump` drafts from the diff).
      - name: Build release notes
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"

          NOTES=$(git tag -l --format='%(contents)' "$TAG")
          if [ -z "$(printf '%s' "$NOTES" | tr -d '[:space:]')" ]; then
            NOTES=$(git log -1 --pretty=%B "$TAG")
          fi

          # Keep only from the Conventional-Commits subject onward: drops any
          # preamble an AI-drafted message may carry, and the trailing PGP block
          # of signed tags/commits.
          CLEAN=$(printf '%s\n' "$NOTES" \
            | awk 'BEGIN{f=0} /^(feat|fix|chore|docs|refactor|perf|test|build|ci|style|revert)(\(.*\))?!?:/{f=1} f' \
            | sed '/^-----BEGIN PGP SIGNATURE-----/,$d')
          # If nothing matched the convention, fall back to the raw message
          # rather than publishing an empty changelog.
          if [ -z "$(printf '%s' "$CLEAN" | tr -d '[:space:]')" ]; then
            CLEAN="$NOTES"
          fi

          {
            echo "## What's Changed"
            echo
            printf '%s\n' "$CLEAN"
            echo
            echo "---"
            echo
          } > RELEASE_BODY.md

          # Install instructions live in a committed template rather than a
          # heredoc: YAML block scalars re-indent their content, which silently
          # breaks heredoc terminators and markdown code fences.
          cat .github/RELEASE_TEMPLATE.md >> RELEASE_BODY.md

          echo "--- release body preview ---"
          cat RELEASE_BODY.md

      - name: Create GitHub Release
        id: create
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: 'Moraya ${{ github.ref_name }}'
          body_path: RELEASE_BODY.md
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  release:
    needs: [create-release]
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS (aarch64 + x86_64)
          - platform: macos-latest
            args: '--target aarch64-apple-darwin --bundles dmg'
            rust-targets: 'aarch64-apple-darwin,x86_64-apple-darwin'
          - platform: macos-latest
            args: '--target x86_64-apple-darwin --bundles dmg'
            rust-targets: 'aarch64-apple-darwin,x86_64-apple-darwin'
          # Windows (x64 + arm64)
          - platform: windows-latest
            args: ''
            rust-targets: ''
          # Linux x86_64
          - platform: ubuntu-22.04
            args: ''
            rust-targets: ''
          # Linux aarch64 (deb + rpm only, skip AppImage)
          - platform: ubuntu-24.04-arm
            args: '--bundles deb,rpm'
            rust-targets: ''

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v5

      - name: Install Linux dependencies
        if: startsWith(matrix.platform, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev librsvg2-dev patchelf \
            libayatana-appindicator3-dev xdg-utils

      - name: Install WiX Toolset
        if: matrix.platform == 'windows-latest'
        run: |
          $wixDir = "$env:LOCALAPPDATA\tauri\WixTools314"
          if (Test-Path "$wixDir\candle.exe") {
            Write-Host "WiX already cached at $wixDir"
          } else {
            New-Item -ItemType Directory -Force -Path $wixDir | Out-Null
            $url = "https://github.com/wixtoolset/wix3/releases/download/wix3141rtm/wix314-binaries.zip"
            $zip = "$env:TEMP\wix314.zip"
            $maxRetries = 3
            for ($i = 1; $i -le $maxRetries; $i++) {
              try {
                Write-Host "Downloading WiX (attempt $i/$maxRetries)..."
                Invoke-WebRequest -Uri $url -OutFile $zip -UseBasicParsing
                break
              } catch {
                if ($i -eq $maxRetries) { throw }
                Start-Sleep -Seconds 5
              }
            }
            Expand-Archive -Path $zip -DestinationPath $wixDir -Force
            Remove-Item $zip
            Write-Host "WiX installed to $wixDir"
          }
        shell: pwsh

      - name: Setup toolchain
        uses: ./.github/actions/setup-toolchain

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}

      - name: Rust cache
        # Stays on v2 — no v3 has been published yet. Bump when swatinem
        # releases it (`gh api repos/Swatinem/rust-cache/releases/latest
        # --jq .tag_name` to check).
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      # Build and release — tauri-action is pinned to the moving major `@v0`.
      # This still ships correctly but exposes releases to unreviewed breaking
      # changes if the maintainers publish v0.x with new behavior. Before the
      # NEXT release, bump this to a specific patch tag:
      #
      #   gh api repos/tauri-apps/tauri-action/releases/latest --jq .tag_name
      #
      # and paste the result here (e.g. `@v0.5.22`). Verified pinning is one
      # of the CLAUDE.md security standards (§9 "pin third-party actions by
      # commit SHA, not just tag") — a specific tag is a good middle ground.
      - name: Build and release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          releaseId: ${{ needs.create-release.outputs.release-id }}
          args: ${{ matrix.args }}


